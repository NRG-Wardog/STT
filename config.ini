[General]
; Change the global hotkey and right-click tray > Reload settings.
; Supported: CTRL, SHIFT, ALT, WIN + A-Z/0-9/F1-F12/SPACE/?.
hotkey=CTRL+SHIFT+R

; Experimental input compatibility settings. Both options are opt-in.
; Set trusted_terminal_input=1 only for a deliberately trusted terminal.
trusted_terminal_input=0
; unicode is the default; clipboard temporarily uses text-only clipboard data.
input_method=unicode
; Pace Unicode events for compatibility with common Windows editors.
unicode_delay_ms=5

; auto, he, or en. Use multilingual models, never *.en.bin.
language=auto
; CPU is supported by the standard build; CUDA requires a separate CUDA build.
backend=cpu
model=models\ggml-small-q5_1.bin
; silero uses a small local VAD model; energy keeps the original RMS gate.
vad_backend=silero
vad_model=models\ggml-silero-v6.2.0.bin

; The following two settings apply only to vad_backend=energy.
rms_threshold=0.013
; Reject strongly noise-like frames. 1.0 disables this experimental gate.
max_zero_crossing=0.35
silence_ms=1200
preroll_ms=600
max_phrase_seconds=15

; 0 = 1-4 threads automatically, or set 1..16.
threads=0
model_idle_seconds=45

; Experimental progressive text. Off by default in the public MVP package.
streaming_prototype=0
streaming_interval_ms=1000
streaming_agreement=2
streaming_hold_words=1
