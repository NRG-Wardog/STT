<!doctype html>
<html lang="en"><meta charset="utf-8"><title>HebEN controlled local editor</title>
<form id="form"><input id="input" aria-label="Local input"><textarea id="textarea" aria-label="Local textarea"></textarea>
<div id="editable" contenteditable="true" role="textbox" aria-label="Local contenteditable"></div><button type="submit">Submit</button></form>
<script>
window.testSubmissions=0;window.testEvents=[];
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();window.testSubmissions++;});
for(const id of ['input','textarea','editable']) for(const type of ['beforeinput','input','keydown','keyup'])
 document.getElementById(id).addEventListener(type,e=>window.testEvents.push({id,type,inputType:e.inputType||null}));
</script></html>
